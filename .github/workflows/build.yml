name: Build, test & release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]          # a release created on github.com gets both exes attached
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create the release v<Version from Subtitle Machine.vbproj> with both exes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/SubtitleMachine.Tests/SubtitleMachine.Tests.vbproj -c Release

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            # Version from the project file (used for manual releases).
            $v = ([xml](Get-Content "Subtitle Machine.vbproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Two editions of the same app:
      #   SubtitleMachine.exe            – small, needs the .NET 10 Desktop Runtime
      #   SubtitleMachine-standalone.exe – larger, includes .NET (nothing to install)
      # Each copy of the app updates itself with the file of its own edition.
      - name: Publish both editions
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $common = @("Subtitle Machine.vbproj", "-c", "Release", "-r", "win-x64", "-p:PublishSingleFile=true")
          if ($v) { $common += @("-p:Version=$v", "-p:AssemblyVersion=$v.0", "-p:FileVersion=$v.0") }
          dotnet publish @common --self-contained false -o out/fd
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/sc
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/fd/Subtitle Machine.exe" dist/SubtitleMachine.exe
          Copy-Item "out/sc/Subtitle Machine.exe" dist/SubtitleMachine-standalone.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload exes
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleMachine
          path: dist/*.exe

      # Code signing (SignPath Foundation, free for open source) – only for releases, and only once the
      # repository variables / secret below exist. Each signing request is approved manually on SignPath.
      - name: Sign with SignPath
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Use the signed exes
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed/*.exe dist/ -Force
          Get-ChildItem dist/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not signed correctly" }
          }

      # A tag like v1.3.0, a release created on github.com, or "Run workflow" publishes the exes;
      # running copies of the app update themselves from the newest release.
      - name: Create / update release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Subtitle Machine ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          overwrite_files: true
          generate_release_notes: true
          body: |
            **Which file?**
            - `SubtitleMachine-standalone.exe` – works on any Windows 10/11 x64 PC, nothing else to install.
            - `SubtitleMachine.exe` – smaller; needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).

            FFmpeg, Whisper, llama.cpp and the TranslateGemma model are downloaded by the app on first start.

            [Code signing policy](https://github.com/polemarxos/Subtitle-Machine#code-signing-policy) · [Privacy](https://github.com/polemarxos/Subtitle-Machine#privacy)
